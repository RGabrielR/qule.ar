# Análisis de seguridad automático (CodeQL de GitHub, gratis para repos públicos).
# Busca en el código patrones peligrosos: inyección de SQL o de HTML, rutas armadas con lo que manda
# quien usa la app, secretos escritos a mano, workflows de Actions inseguros, etc.
# Corre en cada PR, en cada push a main y una vez por semana (por si aparecen reglas nuevas).
# Lo que encuentra aparece en la pestaña Security > Code scanning y como comentario en el PR.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  analizar:
    name: Analizar (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # El código de la app (API y web) y los propios workflows de GitHub Actions
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Las reglas de seguridad más las de calidad que suelen esconder bugs de seguridad
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
